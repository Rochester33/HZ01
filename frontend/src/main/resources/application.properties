server.port=8081
spring.application.name=hz01-frontend

# Force JVM and Spring default locale to English
spring.web.locale=en
spring.web.locale-resolver=fixed

# Backend API base URL
# Default to localhost for development, override with environment variable in production
hz01.backend.url=${BACKEND_URL:http://localhost:8000}

# Vaadin
vaadin.launch-browser=false
vaadin.devmode.enabled=false
vaadin.allowed-packages=com.vaadin,org.vaadin,dev.hilla,com.hz01

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
